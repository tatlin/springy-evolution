[package]
name = "springy-evolution"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Rust + Bevy port of Cary Huang's Evolution Simulator (via tatlin/evolution3WEB)"

[dependencies]
bevy = "0.20"
# Level files (assets/levels/*.level.ron). Both are already in the tree via Bevy.
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# Hot-reload level files while designing them. There's no file watcher on the web.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.20", features = ["file_watcher"] }

# Already in the tree via Bevy's web backend; used for a random seed in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

# The simulation is hot; keep deps optimized even in dev builds.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# Smaller download for the web build (see .github/workflows/pages.yml).
[profile.web]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
