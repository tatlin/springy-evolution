<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Springy Evolution</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #78c8ff;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #123;
        font-size: 18px;
        text-align: center;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading Springy Evolution…</div>
    <script>
      // Browsers start audio suspended until a user gesture, and Bevy's audio backend only asks
      // to resume once, at startup. Keep every AudioContext it makes and resume them on input.
      // This must run before the bindings module loads, because it captures AudioContext then.
      const audioContexts = [];
      const NativeAudioContext = window.AudioContext;
      if (NativeAudioContext) {
        window.AudioContext = class extends NativeAudioContext {
          constructor(...args) {
            super(...args);
            audioContexts.push(this);
          }
        };
      }
      const resumeAudio = () => {
        for (const ctx of audioContexts) if (ctx.state !== "running") ctx.resume();
      };
      for (const type of ["keydown", "pointerdown", "touchend"]) {
        addEventListener(type, resumeAudio, { capture: true });
      }
    </script>
    <script type="module">
      import init from "./springy-evolution.js";

      const status = document.getElementById("status");

      // Bevy creates its own canvas; hide the message and give it keyboard focus once it does.
      new MutationObserver((_, observer) => {
        const canvas = document.querySelector("canvas");
        if (!canvas) return;
        status.remove();
        canvas.focus();
        observer.disconnect();
      }).observe(document.body, { childList: true });

      init().catch((error) => {
        // winit escapes its startup call with an exception on purpose; ignore that one.
        if (`${error}`.includes("Using exceptions for control flow")) return;
        status.textContent = `Failed to start: ${error}`;
        throw error;
      });
    </script>
  </body>
</html>
